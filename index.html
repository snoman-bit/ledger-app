<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1C1F24" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<title>Ledger</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1F24;
    --surface:#1B1F23;
    --surface-2:#20242A;
    --text:#EDE8DE;
    --muted:#868C8F;
    --muted-2:#5C6165;
    --gold:#C9A24B;
    --gold-dim:#8A7638;
    --brick:#6B4A46;
    --brick-bright:#B77F78;
    --line:#262A2E;
    --radius:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .serif{ font-family:'Fraunces', serif; }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;
    flex-direction:column;
  }
  .screen{ display:none; flex-direction:column; flex:1; padding:28px 22px 60px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .screen.active{ display:flex; }

  h1.title{ font-family:'Fraunces', serif; font-weight:500; font-size:26px; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 28px; line-height:1.5;}

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:500; font-size:15px;
    padding:14px 18px; border-radius:var(--radius);
    background:var(--gold); color:#191A16;
    width:100%;
  }
  .btn:active{ background:var(--gold-dim); }
  .btn.secondary{
    background:transparent; color:var(--text); border:1px solid var(--line);
  }
  .btn.secondary:active{ background:var(--surface-2); }
  .btn.ghost{
    background:transparent; color:var(--muted); border:none; padding:10px 4px; width:auto;
    font-size:14px; text-decoration:underline; text-underline-offset:3px;
  }
  .btn.danger{ color:var(--brick-bright); }

  input[type=text], input[type=time]{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    font-family:'Inter',sans-serif; font-size:16px; padding:12px 14px; border-radius:var(--radius);
  }
  input[type=text]:focus, input[type=time]:focus{ outline:1px solid var(--gold-dim); border-color:var(--gold-dim); }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; letter-spacing:.02em; }

  .item-row{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .item-row input[type=text]{ flex:1; border:none; background:transparent; padding:6px 2px; }
  .remove-x{ color:var(--muted); background:none; border:none; font-size:18px; cursor:pointer; padding:4px 6px; }

  .add-row{ display:flex; gap:8px; margin-top:14px; }
  .add-row input{ flex:1; }
  .add-row button{ width:auto; padding:12px 16px; }

  .spacer{ height:36px; }

  /* GATE */
  #gate{ justify-content:flex-start; }
  .gate-date{ color:var(--muted); font-size:13px; margin-bottom:2px; }
  .check-list{ margin-top:22px; }
  .check-row{
    display:flex; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--line);
    cursor:pointer; user-select:none;
  }
  .box{
    width:24px; height:24px; min-width:24px; border:1.5px solid var(--muted-2); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center; transition:border-color .15s, background .15s;
  }
  .check-row.on .box{ border-color:var(--gold); background:var(--gold); }
  .box svg{ width:14px; height:14px; opacity:0; transition:opacity .15s; }
  .check-row.on .box svg{ opacity:1; }
  .check-row span.label{ font-size:16px; }
  .check-row.on span.label{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--muted-2); }

  /* HOME */
  .top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .gear{ background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px; }

  .streak-block{ margin:18px 0 30px; }
  .streak-num{ font-family:'Fraunces', serif; font-size:56px; font-weight:500; line-height:1; }
  .streak-label{ color:var(--muted); font-size:13px; margin-top:4px; }

  .section-label{ font-size:12px; color:var(--muted); letter-spacing:.03em; margin:0 0 12px; text-transform:none; }

  .bars{ display:flex; align-items:flex-end; gap:5px; height:80px; margin-bottom:6px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar{ width:100%; background:var(--surface-2); border-radius:1px; min-height:3px; }
  .bar.full{ background:var(--gold); }
  .bar.missed{ background:var(--brick); }
  .bar-day{ font-size:10px; color:var(--muted-2); margin-top:6px; }

  .history{ margin-top:26px; }
  .hist-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .hist-date{ color:var(--text); }
  .hist-date .dow{ color:var(--muted); font-size:12px; margin-left:6px; }
  .hist-ratio{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .hist-ratio.full{ color:var(--gold); }
  .hist-ratio.zero{ color:var(--brick-bright); }
  .empty-note{ color:var(--muted); font-size:14px; padding:20px 0; }

  .waiting-box{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:24px;
  }
  .waiting-box .t{ font-size:14px; margin-bottom:4px; }
  .waiting-box .d{ font-size:13px; color:var(--muted); }

  /* SETTINGS */
  .toggle-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
  .toggle-row .t{ font-size:15px; }
  .switch{ width:44px; height:26px; background:var(--surface-2); border-radius:20px; position:relative; cursor:pointer; border:1px solid var(--line); }
  .switch .dot{ width:20px; height:20px; background:var(--muted); border-radius:50%; position:absolute; top:2px; left:2px; transition:left .15s, background .15s; }
  .switch.on{ background:var(--gold-dim); }
  .switch.on .dot{ left:20px; background:var(--gold); }

  .back-link{ color:var(--muted); font-size:14px; background:none; border:none; padding:0 0 22px; text-align:left; cursor:pointer; }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP -->
  <section id="setup" class="screen">
    <h1 class="title">Set up your ledger</h1>
    <p class="sub">Write the things you want to be able to say you did each day. You'll check them off tonight.</p>

    <div id="setup-items"></div>
    <div class="add-row">
      <input type="text" id="new-item-input" placeholder="e.g. Work out" maxlength="60" />
      <button class="btn secondary" id="add-item-btn" type="button">Add</button>
    </div>

    <div class="field" style="margin-top:28px;">
      <label>What time should it appear each night?</label>
      <input type="time" id="setup-time" value="22:00" />
    </div>

    <div class="spacer"></div>
    <button class="btn" id="finish-setup-btn">Start</button>
  </section>

  <!-- GATE -->
  <section id="gate" class="screen">
    <div class="gate-date" id="gate-date"></div>
    <h1 class="title">How did today go?</h1>
    <p class="sub">Check what you actually did. This locks in at midnight — no editing after.</p>
    <div class="check-list" id="gate-list"></div>
    <div class="spacer"></div>
    <button class="btn" id="submit-gate-btn">Lock it in</button>
  </section>

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="top-row">
      <div>
        <h1 class="title" id="home-greeting">Ledger</h1>
      </div>
      <button class="gear" id="open-settings-btn" aria-label="Settings">⚙</button>
    </div>

    <div id="waiting-box-holder"></div>

    <div class="streak-block">
      <div class="streak-num" id="streak-num">0</div>
      <div class="streak-label" id="streak-label">day streak</div>
    </div>

    <p class="section-label">Last 14 days</p>
    <div class="bars" id="bars"></div>

    <p class="section-label" style="margin-top:30px;">History</p>
    <div class="history" id="history-list"></div>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="screen">
    <button class="back-link" id="settings-back-btn">← Back</button>
    <h1 class="title">Settings</h1>

    <div class="toggle-row">
      <span class="t">Daily check-in</span>
      <div class="switch" id="enabled-switch"><div class="dot"></div></div>
    </div>
    <div class="field" style="margin-top:20px;">
      <label>Time it appears</label>
      <input type="time" id="settings-time" />
    </div>

    <p class="section-label" style="margin-top:26px;">Your list</p>
    <div id="settings-items"></div>
    <div class="add-row">
      <input type="text" id="settings-new-item-input" placeholder="Add an item" maxlength="60" />
      <button class="btn secondary" id="settings-add-item-btn" type="button">Add</button>
    </div>

    <div class="spacer"></div>
    <button class="btn ghost danger" id="reset-btn" type="button">Erase all data and start over</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  var CONFIG_KEY = "dc_config_v1";
  var ENTRIES_KEY = "dc_entries_v1";

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function todayKey(d){
    d = d || new Date();
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+"-"+m+"-"+day;
  }
  function addDays(dateKey, n){
    var parts = dateKey.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+n);
    return todayKey(d);
  }
  function dayLabel(dateKey, opts){
    var parts = dateKey.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    return d.toLocaleDateString(undefined, opts || {weekday:'short', month:'short', day:'numeric'});
  }

  function storageOK(){
    try{
      var t = "__t__";
      localStorage.setItem(t, "1");
      localStorage.removeItem(t);
      return true;
    }catch(e){ return false; }
  }
  function loadConfig(){
    try{ return JSON.parse(localStorage.getItem(CONFIG_KEY)) || null; }catch(e){ return null; }
  }
  function saveConfig(c){
    try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }
    catch(e){ alert("Couldn't save: " + e.message + "\n\nThis usually means Private Browsing is on, or storage is blocked for this app."); }
  }
  function loadEntries(){
    try{ return JSON.parse(localStorage.getItem(ENTRIES_KEY)) || {}; }catch(e){ return {}; }
  }
  function saveEntries(e){
    try{ localStorage.setItem(ENTRIES_KEY, JSON.stringify(e)); }
    catch(err){ alert("Couldn't save: " + err.message); }
  }

  var config = loadConfig();
  var entries = loadEntries();

  function screens(){ return document.querySelectorAll('.screen'); }
  function show(id){
    screens().forEach(function(s){ s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  // ---------- backfill missed days ----------
  function backfill(){
    if(!config || !config.setupDone || !config.enabled) return;
    var dates = Object.keys(entries);
    var lastKey = config.lastSeenDate || (dates.length ? dates.sort().pop() : todayKey(addDays(todayKey(),-1)));
    var cursor = addDays(lastKey, 1);
    var today = todayKey();
    var guard = 0;
    while(cursor < today && guard < 3650){
      if(!entries[cursor]){
        entries[cursor] = { items: config.items, checks: {}, missed:true, submittedAt:null };
      }
      cursor = addDays(cursor, 1);
      guard++;
    }
    config.lastSeenDate = addDays(today, -1);
    saveEntries(entries);
    saveConfig(config);
  }

  function timeHasPassed(timeStr){
    var now = new Date();
    var parts = timeStr.split(":").map(Number);
    var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parts[0], parts[1], 0);
    return now >= target;
  }

  function gateShouldShow(){
    if(!config.enabled) return false;
    var tk = todayKey();
    if(entries[tk]) return false;
    return timeHasPassed(config.targetTime);
  }

  // ---------- SETUP ----------
  var setupItems = [];
  function renderSetupItems(){
    var holder = document.getElementById('setup-items');
    holder.innerHTML = "";
    setupItems.forEach(function(it, idx){
      var row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = '<span class="box" style="border:none;width:6px;height:6px;border-radius:50%;background:var(--muted-2);min-width:6px;"></span>' +
        '<input type="text" value="" maxlength="60" />' +
        '<button class="remove-x" type="button">×</button>';
      var inp = row.querySelector('input');
      inp.value = it.label;
      inp.addEventListener('input', function(){ setupItems[idx].label = inp.value; });
      row.querySelector('.remove-x').addEventListener('click', function(){
        setupItems.splice(idx,1);
        renderSetupItems();
      });
      holder.appendChild(row);
    });
  }
  document.getElementById('add-item-btn').addEventListener('click', function(){
    var inp = document.getElementById('new-item-input');
    var val = inp.value.trim();
    if(!val) return;
    setupItems.push({id:uid(), label:val});
    inp.value = "";
    renderSetupItems();
    inp.focus();
  });
  document.getElementById('new-item-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('add-item-btn').click(); }
  });
  document.getElementById('finish-setup-btn').addEventListener('click', function(){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var cleanItems = setupItems.filter(function(it){ return it.label && it.label.trim().length > 0; });
    if(cleanItems.length === 0){
      alert("Add at least one thing to your list first.");
      return;
    }
    if(!storageOK()){
      alert("This browser is blocking storage (often Private Browsing). Open this from your home screen icon, not a private tab, and try again.");
      return;
    }
    var t = document.getElementById('setup-time').value || "22:00";
    config = {
      items: cleanItems,
      targetTime: t,
      enabled: true,
      setupDone: true,
      lastSeenDate: todayKey(addDays(todayKey(),-1))
    };
    saveConfig(config);
    route();
  });

  // ---------- GATE ----------
  var gateChecks = {};
  function renderGate(){
    document.getElementById('gate-date').textContent = dayLabel(todayKey(), {weekday:'long', month:'long', day:'numeric'});
    var list = document.getElementById('gate-list');
    list.innerHTML = "";
    gateChecks = {};
    config.items.forEach(function(it){
      gateChecks[it.id] = false;
      var row = document.createElement('div');
      row.className = 'check-row';
      row.innerHTML = '<div class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4" stroke="#191A16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="label"></span>';
      row.querySelector('.label').textContent = it.label;
      row.addEventListener('click', function(){
        gateChecks[it.id] = !gateChecks[it.id];
        row.classList.toggle('on', gateChecks[it.id]);
      });
      list.appendChild(row);
    });
  }
  document.getElementById('submit-gate-btn').addEventListener('click', function(){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var tk = todayKey();
    entries[tk] = { items: config.items, checks: gateChecks, missed:false, submittedAt: new Date().toISOString() };
    config.lastSeenDate = addDays(tk, -1);
    saveEntries(entries);
    saveConfig(config);
    route();
  });

  // ---------- HOME ----------
  function ratioFor(entry){
    if(!entry || !entry.items || entry.items.length===0) return {done:0, total:0};
    var total = entry.items.length;
    var done = entry.items.reduce(function(acc, it){ return acc + (entry.checks[it.id] ? 1 : 0); }, 0);
    return {done:done, total:total};
  }
  function computeStreak(){
    var keys = Object.keys(entries).sort();
    var streak = 0;
    var cursor = todayKey();
    var todayEntry = entries[cursor];
    if(!todayEntry) cursor = addDays(cursor, -1);
    while(true){
      var e = entries[cursor];
      if(!e) break;
      var r = ratioFor(e);
      if(r.total>0 && r.done === r.total){ streak++; cursor = addDays(cursor,-1); }
      else break;
    }
    return streak;
  }
  function renderBars(){
    var bars = document.getElementById('bars');
    bars.innerHTML = "";
    var days = [];
    for(var i=13;i>=0;i--) days.push(addDays(todayKey(), -i));
    days.forEach(function(dk){
      var e = entries[dk];
      var col = document.createElement('div');
      col.className = 'bar-col';
      var bar = document.createElement('div');
      bar.className = 'bar';
      var h = 6;
      if(e){
        var r = ratioFor(e);
        var pct = r.total ? (r.done/r.total) : 0;
        h = Math.max(3, Math.round(pct*72));
        if(pct === 1) bar.classList.add('full');
        else if(pct === 0) bar.classList.add('missed');
      }
      bar.style.height = h+"px";
      col.appendChild(bar);
      var lbl = document.createElement('div');
      lbl.className = 'bar-day';
      lbl.textContent = dayLabel(dk, {weekday:'narrow'});
      col.appendChild(lbl);
      bars.appendChild(col);
    });
  }
  function renderHistory(){
    var holder = document.getElementById('history-list');
    holder.innerHTML = "";
    var keys = Object.keys(entries).sort().reverse();
    if(keys.length === 0){
      holder.innerHTML = '<div class="empty-note">Nothing recorded yet. Your first entry shows up here tomorrow.</div>';
      return;
    }
    keys.slice(0,60).forEach(function(dk){
      var e = entries[dk];
      var r = ratioFor(e);
      var row = document.createElement('div');
      row.className = 'hist-row';
      var cls = r.total>0 && r.done===r.total ? 'full' : (r.done===0 ? 'zero' : '');
      row.innerHTML = '<span class="hist-date">'+dayLabel(dk)+'</span><span class="hist-ratio '+cls+'">'+r.done+'/'+r.total+'</span>';
      holder.appendChild(row);
    });
  }
  function renderWaiting(){
    var holder = document.getElementById('waiting-box-holder');
    holder.innerHTML = "";
    if(!config.enabled) return;
    var tk = todayKey();
    if(entries[tk]) return;
    if(!timeHasPassed(config.targetTime)){
      var box = document.createElement('div');
      box.className = 'waiting-box';
      box.innerHTML = '<div class="t">Tonight\'s check-in appears at '+formatTime(config.targetTime)+'.</div><div class="d">Come back then to log today.</div>';
      holder.appendChild(box);
    }
  }
  function formatTime(t){
    var parts = t.split(":").map(Number);
    var d = new Date(); d.setHours(parts[0], parts[1]);
    return d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  }
  function renderHome(){
    document.getElementById('home-greeting').textContent = "Ledger";
    renderWaiting();
    var streak = computeStreak();
    document.getElementById('streak-num').textContent = streak;
    document.getElementById('streak-label').textContent = streak === 1 ? "day streak" : "day streak";
    renderBars();
    renderHistory();
  }
  document.getElementById('open-settings-btn').addEventListener('click', function(){
    renderSettings();
    show('settings');
  });

  // ---------- SETTINGS ----------
  function renderSettings(){
    document.getElementById('settings-time').value = config.targetTime;
    var sw = document.getElementById('enabled-switch');
    sw.classList.toggle('on', !!config.enabled);
    renderSettingsItems();
  }
  function renderSettingsItems(){
    var holder = document.getElementById('settings-items');
    holder.innerHTML = "";
    config.items.forEach(function(it, idx){
      var row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = '<span class="box" style="border:none;width:6px;height:6px;border-radius:50%;background:var(--muted-2);min-width:6px;"></span>' +
        '<input type="text" maxlength="60" />' +
        '<button class="remove-x" type="button">×</button>';
      var inp = row.querySelector('input');
      inp.value = it.label;
      inp.addEventListener('change', function(){
        it.label = inp.value.trim() || it.label;
        saveConfig(config);
      });
      row.querySelector('.remove-x').addEventListener('click', function(){
        if(config.items.length <= 1){ alert("You need at least one item on your list."); return; }
        config.items.splice(idx,1);
        saveConfig(config);
        renderSettingsItems();
      });
      holder.appendChild(row);
    });
  }
  document.getElementById('settings-add-item-btn').addEventListener('click', function(){
    var inp = document.getElementById('settings-new-item-input');
    var val = inp.value.trim();
    if(!val) return;
    config.items.push({id:uid(), label:val});
    saveConfig(config);
    inp.value = "";
    renderSettingsItems();
  });
  document.getElementById('settings-new-item-input').addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('settings-add-item-btn').click(); }
  });
  document.getElementById('settings-time').addEventListener('change', function(e){
    config.targetTime = e.target.value;
    saveConfig(config);
  });
  document.getElementById('enabled-switch').addEventListener('click', function(){
    config.enabled = !config.enabled;
    saveConfig(config);
    this.classList.toggle('on', config.enabled);
  });
  document.getElementById('settings-back-btn').addEventListener('click', function(){
    route();
  });
  document.getElementById('reset-btn').addEventListener('click', function(){
    if(confirm("This deletes your whole history and list. This can't be undone. Erase everything?")){
      localStorage.removeItem(CONFIG_KEY);
      localStorage.removeItem(ENTRIES_KEY);
      config = null; entries = {};
      setupItems = [];
      renderSetupItems();
      route();
    }
  });

  // ---------- ROUTER ----------
  function route(){
    if(!config || !config.setupDone){
      setupItems = [{id:uid(), label:""}];
      renderSetupItems();
      show('setup');
      return;
    }
    backfill();
    if(gateShouldShow()){
      renderGate();
      show('gate');
      return;
    }
    renderHome();
    show('home');
  }

  // re-check periodically in case the app is left open across the target time / midnight
  setInterval(function(){
    if(!document.hidden){
      var activeIsSettings = document.getElementById('settings').classList.contains('active');
      var activeIsSetup = document.getElementById('setup').classList.contains('active');
      if(!activeIsSettings && !activeIsSetup) route();
    }
  }, 30000);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) route();
  });

  route();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
